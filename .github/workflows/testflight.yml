name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compile check with no signing and no secrets: proves the project builds against the iOS SDK.
  compile-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode info
        run: |
          xcodebuild -version
          xcodebuild -list -project SoundPhotoTest.xcodeproj
      - name: Build for generic iOS device (unsigned)
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild build \
            -project SoundPhotoTest.xcodeproj \
            -scheme SoundPhotoTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee logs/compile-check.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-check-logs
          path: logs/

  testflight:
    needs: compile-check
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      HAS_P8: ${{ secrets.ASC_API_KEY_P8 != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repo secret $v is not set"; missing=1; fi
          done
          if [ "$HAS_P8" != "true" ]; then echo "::error::Repo secret ASC_API_KEY_P8 is not set"; missing=1; fi
          exit $missing

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Xcode info
        run: xcodebuild -version

      # Archive unsigned: the team has no registered devices, so a development profile
      # can't be made. -exportArchive signs with an App Store distribution profile instead.
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p logs build
          xcodebuild archive \
            -project SoundPhotoTest.xcodeproj \
            -scheme SoundPhotoTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SoundPhotoTest.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee logs/archive.log

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SoundPhotoTest.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee logs/export-upload.log

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          find build/export -name '*.log' -exec cp {} logs/ \; 2>/dev/null || true
          ls -la build/export 2>/dev/null || true
          find /var/folders -name 'IDEDistribution*.log' -newer "$GITHUB_WORKSPACE/README.md" -exec cp {} logs/ \; 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: logs/

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
